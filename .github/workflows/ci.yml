name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/pip install --no-deps -e .
      - name: Lint
        run: |
          .venv/bin/ruff check app tests alembic
          .venv/bin/ruff format --check app tests alembic
      - name: Type check
        run: .venv/bin/mypy app
      - name: Test
        run: .venv/bin/pytest -p no:logging

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_DIR: /tmp/ret-data
      BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.lock
          .venv/bin/pip install --no-deps -e .
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: API types match the backend
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run gen:api' in frontend/ and commit it."
            exit 1
          }
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start API (serves the build)
        working-directory: backend
        run: |
          mkdir -p "$DATA_DIR"
          nohup .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/api/ready && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Run journeys
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8000
          RET_PASSWORD: ${{ env.BOOTSTRAP_ADMIN_PASSWORD }}
          SHOTS: ${{ runner.temp }}/shots
        run: npm run e2e
      - name: Upload screenshots and API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/api.log
          retention-days: 7

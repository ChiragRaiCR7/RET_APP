[project]
name = "ret-backend"
version = "5.0.0"
description = "RET — Oracle XML/ZIP extraction, conversion, comparison and grounded AI search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1",
    "lxml>=6.1",
    "openpyxl>=3.1.5",
    "openai>=3.41",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "httpx>=0.28", "ruff>=0.17", "mypy>=2.4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "S311"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = []
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
